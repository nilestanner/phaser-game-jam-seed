name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    env:
      # Tests and the webpack build don't need the Electron binary (large download).
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The locked webpack 5.38 hashes with MD4, which OpenSSL 3 (Node 17+) disables by default.
          NODE_OPTIONS: --openssl-legacy-provider
      - run: npm test
